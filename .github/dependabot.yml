# Dependabot keeps Cargo.lock and the workflows' actions current, so fixes
# for newly published advisories arrive as a pull request rather than as a
# red weekly `cargo audit` run on main.
#
# Security updates (pull requests raised as soon as an advisory affecting us
# is published) are switched on in the repository settings, not here; the
# `security-updates` group below only decides how those pull requests are
# batched.
version: 2

updates:
  - package-ecosystem: cargo
    # The workspace root: one Cargo.lock covers both crates.
    directory: /
    schedule:
      interval: weekly
      day: monday
      # UTC, an hour ahead of the weekly audit in ci.yml, so a fix is usually
      # already open by the time the audit would flag it.
      time: "05:00"
    # Every advisory that has broken CI so far was in a transitive dependency
    # (h2, rustls, rustls-webpki, ctutils, ...), and Dependabot only looks at
    # direct ones unless told otherwise.
    allow:
      - dependency-type: all
    # Propose only what `cargo update` would: semver-compatible bumps within
    # the ranges Cargo.toml already allows. Breaking upgrades and raised floors
    # in [workspace.dependencies] stay deliberate, manual changes.
    # resolver = "3" keeps the chosen versions within the MSRV.
    versioning-strategy: lockfile-only
    # Let a new release age a few days before proposing it, so a compromised
    # or quickly yanked publish is less likely to land. Security updates are
    # exempt from this and still arrive straight away.
    cooldown:
      default-days: 3
    groups:
      # One weekly pull request: the equivalent of a housekeeping
      # `cargo update`.
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      # One pull request per batch of advisories rather than one per crate:
      # they tend to land in clusters across related crates (rustls,
      # rustls-webpki, webpki-roots).
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    # Covers every workflow under .github/workflows.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    cooldown:
      default-days: 3
    ignore:
      # Its refs are a toolchain channel (@stable) and the pinned MSRV
      # (@1.91.0), not action versions. Bumping @1.91.0 would quietly stop
      # the msrv job from checking the MSRV.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
